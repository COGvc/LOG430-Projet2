# Projet de demarrage LOG430 - Phase 2 CanDroneX : API Gateway + OAuth2/JWT
# Seuls l'API Gateway (8080) et Keycloak (8081, pour obtenir un jeton) sont exposes.
services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    command: start-dev --import-realm --http-port=8080
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_ADMIN}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_ADMIN_PASSWORD}
      # Emetteur (iss) fixe, que le jeton soit obtenu via localhost:8081 ou keycloak:8080
      KC_HOSTNAME: http://localhost:8081
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HEALTH_ENABLED: "true"
      CANDRONEX_ADMIN_SECRET: ${CANDRONEX_ADMIN_SECRET}
      CLIENT_MANAGEMENT_SERVICE_SECRET: ${CLIENT_MANAGEMENT_SERVICE_SECRET}
      INSPECTRA_DEMO_SECRET: ${INSPECTRA_DEMO_SECRET}
      AEROTECH_DEMO_SECRET: ${AEROTECH_DEMO_SECRET}
      JETON_COURT_SECRET: ${JETON_COURT_SECRET}
    volumes:
      - ./keycloak/realm-candronex.json:/opt/keycloak/data/import/realm-candronex.json:ro
    ports:
      - "8081:8080"
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/9000 && echo -e 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q 'UP' <&3"]
      interval: 10s
      retries: 20

  api-gateway:
    image: devopsfaith/krakend:2.7.2
    volumes:
      - ./krakend/krakend.json:/etc/krakend/krakend.json:ro
    ports:
      - "${GATEWAY_PORT:-8080}:8080"
    depends_on:
      keycloak: { condition: service_healthy }

  # Phase 3 : onboarding de clients B2B par API (UC-01 complet)
  client-management-service:
    build: ./client-management-service
    environment:
      KEYCLOAK_URL: http://keycloak:8080
      CLIENT_MANAGEMENT_SERVICE_SECRET: ${CLIENT_MANAGEMENT_SERVICE_SECRET}
    depends_on:
      keycloak: { condition: service_healthy }
    # pas de "ports:" : joignable uniquement par la passerelle

  drone-management-service:
    build: ./drone-management-service
    # pas de "ports:" : joignable uniquement par la passerelle
