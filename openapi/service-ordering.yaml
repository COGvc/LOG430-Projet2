openapi: 3.1.0
info:
  title: service-ordering-service
  version: 0.1.0
paths:
  /health:
    get:
      summary: Sante
      operationId: sante_health_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
  /api/service-ordering/v1/catalog:
    get:
      summary: Lister Catalogue
      operationId: lister_catalogue_api_service_ordering_v1_catalog_get
      parameters:
      - name: authorization
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/service-ordering/v1/serviceOrder:
    post:
      summary: Commander
      operationId: commander_api_service_ordering_v1_serviceOrder_post
      parameters:
      - name: idempotency-key
        in: header
        required: false
        schema:
          anyOf:
          - type: string
            maxLength: 128
          - type: 'null'
          title: Idempotency-Key
      - name: authorization
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CommandeEntrante'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    get:
      summary: Lister
      operationId: lister_api_service_ordering_v1_serviceOrder_get
      parameters:
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 1000
          minimum: 1
          default: 100
          title: Limit
      - name: authorization
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/service-ordering/v1/serviceOrder/{order_id}:
    get:
      summary: Consulter
      operationId: consulter_api_service_ordering_v1_serviceOrder__order_id__get
      parameters:
      - name: order_id
        in: path
        required: true
        schema:
          type: string
          title: Order Id
      - name: authorization
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
components:
  schemas:
    CommandeEntrante:
      properties:
        items:
          items:
            $ref: '#/components/schemas/LigneEntrante'
          type: array
          maxItems: 20
          minItems: 1
          title: Items
      type: object
      required:
      - items
      title: CommandeEntrante
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    LigneEntrante:
      properties:
        droneId:
          type: string
          maxLength: 64
          minLength: 1
          title: Droneid
        serviceType:
          type: string
          maxLength: 32
          minLength: 1
          title: Servicetype
      type: object
      required:
      - droneId
      - serviceType
      title: LigneEntrante
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
